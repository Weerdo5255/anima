[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "anima-brain"
version = "0.5.0"
description = "A local framework for brain-like spiking agents that live on their own clock instead of waiting for prompts."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "anima contributors" }]
dependencies = ["numpy>=1.23"]
keywords = ["spiking neural network", "computational neuroscience", "autonomous agent",
            "STDP", "neuromodulation", "artificial life", "ollama", "LLM tutor", "curriculum learning",
            "multi-agent", "genetic algorithm", "neuroevolution", "GPU", "CUDA", "CuPy", "PyTorch"]
classifiers = [
  "Programming Language :: Python :: 3",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
  "Topic :: Scientific/Engineering :: Bio-Informatics",
  "License :: OSI Approved :: MIT License",
]

[project.optional-dependencies]
plots = ["matplotlib>=3.5"]
dev = ["pytest>=7", "matplotlib>=3.5"]
windows = ["windows-curses; platform_system == 'Windows'"]
# a GPU (see `anima gpu-check`): CuPy for NVIDIA — pick the one matching your CUDA — or PyTorch
cuda12 = ["cupy-cuda12x>=12"]
cuda11 = ["cupy-cuda11x>=11"]
torch = ["torch>=2.1"]

[project.scripts]
anima = "anima.cli:main"

[tool.setuptools.packages.find]
include = ["anima*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
