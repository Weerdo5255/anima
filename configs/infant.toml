post = "motor"
p = 0.15
weight = 0.002
w_max = 0.02
fixed_indegree = true

[projection.rule]
type = "reward_stdp"
a_plus = 1.0
a_minus = 0.0
tau_e = 300.0
lr = 0.05
normalize = "both"

[[projection]]
