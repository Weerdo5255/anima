[[projection]]
pre = "motor"
post = "motor"
topology = "channels"
p = 0.3
weight = 0.01
fixed_indegree = true

[[projection]]
pre = "motor"
post = "motor.inh"
p = 0.5
weight = 0.02
fixed_indegree = true

[[projection]]
